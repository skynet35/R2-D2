[package]
name = "compozit-rs"
version = "0.1.0"
edition = "2024"

# L'exécutable livré porte le nom de l'application.
[[bin]]
name = "CompoZIT"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bcrypt = "0.19.3"
minijinja = { version = "3.0.1", features = ["json", "serde"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros"] }
tokio = { version = "1.54.0", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
