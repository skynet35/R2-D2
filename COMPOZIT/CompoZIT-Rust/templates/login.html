{% extends "plain.html" %}

{% block content %}
<div class="panel">
    <div class="panel-head">
        <span class="brand-mark">C</span>
        <div>
            <h1>CompoZ<em style="font-style: normal; color: var(--accent);">'IT</em></h1>
            <div class="subtitle">Connectez-vous pour accéder à l'inventaire</div>
        </div>
    </div>

    {% if error %}
    <div class="alert error" style="margin-bottom: 18px;"><span>⚠️</span><span>{{ error }}</span></div>
    {% endif %}

    <form method="post" action="/login" class="form-grid">
        <div>
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
        </div>
        <div>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="form-actions">
            <button class="btn" type="submit">Se connecter</button>
            <span class="spacer"></span>
            <a class="btn btn-ghost btn-sm" href="/setup">Configurer la base</a>
        </div>
    </form>

    <div class="foot-note">
        Les comptes sont ceux de la base MySQL : {{ db_label }}
    </div>
</div>
{% endblock %}
