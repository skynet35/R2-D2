<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CompoZ'IT{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('compozit.theme'); } catch (e) { }
            if (!theme) {
                theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
<script>
    // Présence de la page : tant qu'elle répond, le serveur local reste
    // ouvert. Onglet ou navigateur fermé, il s'arrête et l'exe peut être
    // relancé aussitôt.
    (function () {
        var leaving = false;
        var markLeaving = function () {
            leaving = true;
            setTimeout(function () { leaving = false; }, 5000);
        };
        // Un clic sur un lien ou un bouton de formulaire annonce un changement
        // de page : la page suivante se signalera, inutile de fermer.
        try {
            document.addEventListener('click', function (event) {
                var target = event.target;
                if (target && target.closest
                    && target.closest('a[href], form button, form input[type=submit]')) {
                    markLeaving();
                }
            }, true);
        } catch (e) { }

        var ping = function () {
            try { fetch('/__alive', { cache: 'no-store' }); } catch (e) { }
        };
        ping();
        setInterval(ping, 3000);

        window.addEventListener('pagehide', function () {
            if (leaving) { return; }
            try {
                if (navigator.sendBeacon) { navigator.sendBeacon('/__closing'); return; }
                fetch('/__closing', { method: 'POST', keepalive: true });
            } catch (e) { }
        });
    })();
</script>
<script src="/static/app.js"></script>
</body>
</html>
