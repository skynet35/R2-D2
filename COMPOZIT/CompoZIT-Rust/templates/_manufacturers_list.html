{% if manufacturers %}
<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>Fabricant</th>
                <th class="numeric">Composants</th>
                <th class="actions-head">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for m in manufacturers %}
            <tr data-mfr-row="{{ m.id }}" data-mfr-name="{{ m.name|lower }}">
                <td class="cell-name">{{ m.name }}</td>
                <td class="numeric">
                    <span class="badge {% if m.components > 0 %}info{% endif %}">📦 {{ m.components }}</span>
                </td>
                <td>
                    <div class="actions">
                        <button class="btn btn-sm btn-ghost" type="button" title="Renommer"
                                data-mfr-rename="{{ m.id }}" data-mfr-label="{{ m.name }}">✏️</button>
                        <button class="btn btn-sm danger" type="button" title="Supprimer"
                                data-mfr-delete="{{ m.id }}" data-mfr-label="{{ m.name }}"
                                data-mfr-count="{{ m.components }}">🗑️</button>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="empty">
    <span class="empty-icon">⛭</span>
    <strong>Aucun fabricant référencé</strong>
    <p>Ajoutez une marque ici, ou saisissez-la directement lors de la création d'un composant.</p>
</div>
{% endif %}
